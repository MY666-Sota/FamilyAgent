services:

  # ── 基础数据层 ─────────────────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/01_pgvector.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    env_file: .env
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── 模型托管层 ─────────────────────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    # 本项目 LLM 走 DeepSeek 云端 API（见 .env OPENAI_API_BASE），
    # 本地模型托管默认用不上。设为可选 profile，避免每次 up 都尝试拉巨型镜像。
    # 需要本地模型时：docker compose --profile optional up -d ollama
    profiles:
      - optional
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    # 有 GPU 时取消下面两行注释
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  xinference:
    # CPU 版镜像（3.3GB 压缩，vs GPU 版 latest 的 12GB）。
    # 无 GPU 环境用这个；有 GPU 时改回 xprobe/xinference:latest 并启用 deploy.resources。
    image: xprobe/xinference:latest-cpu
    restart: unless-stopped
    command: >
      xinference-local
      --host 0.0.0.0
      --port 9997
    volumes:
      - xinference_data:/root/.xinference
    ports:
      - "9997:9997"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9997/v1/models"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ── 接入层：企业微信入口 ────────────────────────────────────────────
  # 消息接收：自定义构建（官方镜像 + orchestrator_forwarder 插件 baked in）
  chatgpt-on-wechat:
    build:
      context: ./infra/chatgpt-on-wechat
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      ORCHESTRATOR_URL: "http://host.docker.internal:8081"
      WECHAT_CORP_ID: ${WECHAT_CORP_ID}
      WECHAT_APP_SECRET: ${WECHAT_APP_SECRET}
      WECHAT_AGENT_ID: ${WECHAT_AGENT_ID}
      WECHAT_TOKEN: ${WECHAT_TOKEN}
      WECHAT_AES_KEY: ${WECHAT_AES_KEY}
    volumes:
      - ./infra/chatgpt-on-wechat/config.json:/app/config.json:ro
    ports:
      - "8079:80"
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "80"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      - redis

  # 结果推送：编排核心回调此服务，再由此服务调企微发送消息
  # 实现 INTERFACE_CONTRACT 接口一.3 的 POST /v1/reply
  wechat-reply-server:
    build:
      context: ./infra/chatgpt-on-wechat/reply_server
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      WECHAT_CORP_ID: ${WECHAT_CORP_ID}
      WECHAT_APP_SECRET: ${WECHAT_APP_SECRET}
      WECHAT_AGENT_ID: ${WECHAT_AGENT_ID}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8080/healthz',timeout=5).status==200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      - chatgpt-on-wechat

  # ── 知识库层：Dify ─────────────────────────────────────────────────
  dify-api:
    image: langgenius/dify-api:latest
    restart: unless-stopped
    env_file: .env
    environment:
      MODE: api
      # dify 镜像内进程默认 HOME=/home/dify 但该目录对运行用户不可写，
      # 导致日志刷 Permission denied: '/home/dify'。指到可写的 /app 消除警告。
      HOME: /app
      SECRET_KEY: ${DIFY_SECRET_KEY}
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DIFY_DB}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_DB: 0
      STORAGE_TYPE: local
      STORAGE_LOCAL_PATH: /app/api/storage
      VECTOR_STORE: weaviate
      WEAVIATE_ENDPOINT: http://weaviate:8080
      WEAVIATE_API_KEY: ${WEAVIATE_API_KEY}
    volumes:
      - dify_storage:/app/api/storage
    ports:
      # dify-api 控制台后端暴露到主机 5002（5001 已被 dify-adapter 占用）。
      # 浏览器经此访问 Dify 控制台 API；dify-web 的 CONSOLE_API_URL 指向它。
      - "5002:5001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      weaviate:
        condition: service_started

  dify-worker:
    image: langgenius/dify-api:latest
    restart: unless-stopped
    env_file: .env
    environment:
      MODE: worker
      # 同 dify-api：指 HOME 到可写目录，消除 Permission denied: '/home/dify'
      HOME: /app
      SECRET_KEY: ${DIFY_SECRET_KEY}
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DIFY_DB}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_DB: 0
      STORAGE_TYPE: local
      STORAGE_LOCAL_PATH: /app/api/storage
      VECTOR_STORE: weaviate
      WEAVIATE_ENDPOINT: http://weaviate:8080
      WEAVIATE_API_KEY: ${WEAVIATE_API_KEY}
    volumes:
      - dify_storage:/app/api/storage
    healthcheck:
      test: ["CMD", "sh", "-c", "pgrep -f 'celery.*worker' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      - dify-api

  dify-web:
    image: langgenius/dify-web:latest
    restart: unless-stopped
    env_file: .env
    environment:
      # 前端浏览器直连后端 dify-api 的控制台 API。
      # 注意：主机 5001 端口被 dify-adapter（RAG 契约接口）占用，不能复用；
      # dify-api 控制台后端单独映射到主机 5002（见 dify-api ports）。
      # 这两个 URL 注入到浏览器端，必须用主机可达地址，不能用容器名 dify-api。
      CONSOLE_API_URL: "http://localhost:5002"
      APP_API_URL: "http://localhost:5002"
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  weaviate:
    image: semitechnologies/weaviate:1.24.6
    restart: unless-stopped
    environment:
      QUERY_DEFAULTS_LIMIT: 25
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "true"
      PERSISTENCE_DATA_PATH: /var/lib/weaviate
      DEFAULT_VECTORIZER_MODULE: none
      CLUSTER_HOSTNAME: node1
      WEAVIATE_API_KEY: ${WEAVIATE_API_KEY}
    volumes:
      - weaviate_data:/var/lib/weaviate
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8080/v1/.well-known/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # 接口适配器：把 /v1/rag/query 转换为 Dify 知识库 API
  dify-adapter:
    build:
      context: ./infra/dify
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DIFY_API_URL: http://dify-api:5001
      DIFY_API_KEY: ${DIFY_API_KEY}
      DIFY_DATASET_ID: ${DIFY_DATASET_ID}
    ports:
      - "5001:5001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:5001/healthz',timeout=5).status==200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      - dify-api

  # ── 记忆层：Mem0 ───────────────────────────────────────────────────
  mem0:
    build:
      context: ./infra/mem0
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      OPENAI_API_BASE: ${OPENAI_API_BASE}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL}
      # 默认指向本地 xinference；走云端 embedding（硅基流动等）时在 .env 覆盖
      # EMBEDDING_BASE_URL / EMBEDDING_API_KEY / EMBEDDING_DIMS 三者即可，无需起 xinference。
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-http://xinference:9997/v1}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-xinference}
      EMBEDDING_DIMS: ${EMBEDDING_DIMS:-1536}
      LLM_MODEL: ${LLM_MODEL}
    ports:
      - "8082:8082"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8082/healthz',timeout=5).status==200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    depends_on:
      postgres:
        condition: service_healthy

  # ── 能力层：OCR & PPT ─────────────────────────────────────────────
  # 作业 OCR（供 MCP 工具调用，见 shared/mcp_registry.json port 9003）
  paddleocr:
    image: paddlepaddle/paddle:2.6.1-gpu-cuda12.0-cudnn8.9-trt8.6
    restart: unless-stopped
    command: >
      python -m paddle_serving_server.serve
      --model /models/paddleocr
      --port 8868
    volumes:
      - paddleocr_models:/models
    ports:
      - "8868:8868"
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "8868"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # 无 GPU 时改用 CPU 镜像：paddlepaddle/paddle:2.6.1

  # PPT 生成（Presenton，供 MCP 工具调用，见 shared/mcp_registry.json port 9002）
  # 上游真实服务监听容器内 80 端口，映射到宿主 7860。
  # 镜像：ghcr.io/presenton/presenton（原写法 prezentoss 是 typo）。
  # profiles: presenton — ghcr.io 在代理环境下大文件 EOF 断流，按需拉取。
  # 启动方式：docker compose --profile presenton up -d presenton
  presenton:
    image: ghcr.io/presenton/presenton:latest
    restart: unless-stopped
    profiles:
      - presenton
    env_file: .env
    environment:
      LLM: "openai"
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_BASE_URL: ${OPENAI_API_BASE}
      CAN_CHANGE_KEYS: "false"
    volumes:
      - presenton_data:/app_data
    ports:
      - "7860:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ── 内网穿透：Cloudflare Tunnel ────────────────────────────────────
  # 仅在需要外网访问时启动，TOKEN 留空则此服务不启动
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - nginx
    profiles:
      - tunnel

  # ── 反向代理 ────────────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      - chatgpt-on-wechat
      - wechat-reply-server
      - dify-adapter
      - mem0

volumes:
  postgres_data:
  redis_data:
  ollama_data:
  xinference_data:
  dify_storage:
  weaviate_data:
  paddleocr_models:
  presenton_data:
