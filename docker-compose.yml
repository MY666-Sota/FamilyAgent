services:

  # ── 基础数据层 ─────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    env_file: .env
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── 模型托管层 ─────────────────────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    # 有 GPU 时取消下面两行注释
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  xinference:
    image: xprobe/xinference:latest
    restart: unless-stopped
    command: >
      xinference-local
      --host 0.0.0.0
      --port 9997
    volumes:
      - xinference_data:/root/.xinference
    ports:
      - "9997:9997"
    depends_on:
      - ollama

  # ── 接入层：企业微信入口 ────────────────────────────────────────────
  # 消息接收：chatgpt-on-wechat 官方镜像 + orchestrator_forwarder 插件
  chatgpt-on-wechat:
    image: zhayujie/chatgpt-on-wechat:latest
    restart: unless-stopped
    env_file: .env
    environment:
      ORCHESTRATOR_URL: "http://host.docker.internal:8081"
      WECHAT_CORP_ID: ${WECHAT_CORP_ID}
      WECHAT_APP_SECRET: ${WECHAT_APP_SECRET}
      WECHAT_AGENT_ID: ${WECHAT_AGENT_ID}
      WECHAT_TOKEN: ${WECHAT_TOKEN}
      WECHAT_AES_KEY: ${WECHAT_AES_KEY}
    volumes:
      - ./infra/chatgpt-on-wechat/config.json:/app/config.json:ro
      # 挂载自定义插件
      - ./infra/chatgpt-on-wechat/plugins/orchestrator_forwarder:/app/plugins/orchestrator_forwarder:ro
    ports:
      - "8079:80"    # 内部端口，nginx 反代转 8080
    depends_on:
      - redis

  # 结果推送：编排核心回调此服务，再由此服务调企微发送消息
  # 实现 INTERFACE_CONTRACT 接口一.3 的 POST /v1/reply
  wechat-reply-server:
    build:
      context: ./infra/chatgpt-on-wechat/reply_server
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      WECHAT_CORP_ID: ${WECHAT_CORP_ID}
      WECHAT_APP_SECRET: ${WECHAT_APP_SECRET}
      WECHAT_AGENT_ID: ${WECHAT_AGENT_ID}
    ports:
      - "8080:8080"
    depends_on:
      - chatgpt-on-wechat

  # ── 知识库层：Dify ─────────────────────────────────────────────────
  dify-api:
    image: langgenius/dify-api:latest
    restart: unless-stopped
    env_file: .env
    environment:
      MODE: api
      SECRET_KEY: ${DIFY_SECRET_KEY}
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DIFY_DB}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_DB: 0
      STORAGE_TYPE: local
      STORAGE_LOCAL_PATH: /app/api/storage
      VECTOR_STORE: weaviate
      WEAVIATE_ENDPOINT: http://weaviate:8080
      WEAVIATE_API_KEY: ${WEAVIATE_API_KEY}
    volumes:
      - dify_storage:/app/api/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      weaviate:
        condition: service_started

  dify-worker:
    image: langgenius/dify-api:latest
    restart: unless-stopped
    env_file: .env
    environment:
      MODE: worker
      SECRET_KEY: ${DIFY_SECRET_KEY}
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DIFY_DB}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_DB: 0
      STORAGE_TYPE: local
      STORAGE_LOCAL_PATH: /app/api/storage
      VECTOR_STORE: weaviate
      WEAVIATE_ENDPOINT: http://weaviate:8080
      WEAVIATE_API_KEY: ${WEAVIATE_API_KEY}
    volumes:
      - dify_storage:/app/api/storage
    depends_on:
      - dify-api

  dify-web:
    image: langgenius/dify-web:latest
    restart: unless-stopped
    env_file: .env
    environment:
      CONSOLE_API_URL: ""
      APP_API_URL: ""

  weaviate:
    image: semitechnologies/weaviate:1.24.6
    restart: unless-stopped
    environment:
      QUERY_DEFAULTS_LIMIT: 25
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "true"
      PERSISTENCE_DATA_PATH: /var/lib/weaviate
      DEFAULT_VECTORIZER_MODULE: none
      CLUSTER_HOSTNAME: node1
      WEAVIATE_API_KEY: ${WEAVIATE_API_KEY}
    volumes:
      - weaviate_data:/var/lib/weaviate

  # 接口适配器：把 /v1/rag/query 转换为 Dify 知识库 API
  dify-adapter:
    build:
      context: ./infra/dify
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DIFY_API_URL: http://dify-api
      DIFY_API_KEY: ${DIFY_API_KEY}
    ports:
      - "5001:5001"
    depends_on:
      - dify-api

  # ── 记忆层：Mem0 ───────────────────────────────────────────────────
  mem0:
    build:
      context: ./infra/mem0
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      OPENAI_API_BASE: ${OPENAI_API_BASE}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL}
      LLM_MODEL: ${LLM_MODEL}
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy

  # ── 反向代理 ────────────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
    depends_on:
      - chatgpt-on-wechat
      - dify-adapter
      - mem0

volumes:
  postgres_data:
  redis_data:
  ollama_data:
  xinference_data:
  dify_storage:
  weaviate_data:
